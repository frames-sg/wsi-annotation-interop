[package]
name = "wsi-annotation-interop"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
description = "Neutral DICOM WSI ANN/SEG interoperability harness"
license = "MIT"

[dependencies]
clap = { version = "4.6.6", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tempfile = "3"
ureq = { version = "3.4.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
