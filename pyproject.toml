[project]
name = "wsi-annotation-interop-reference-shim"
version = "0.1.0"
description = "Independent highdicom/pydicom reference shim for the Rust interoperability harness"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = [
  "highdicom==0.28.1",
  "numpy>=2,<3",
  "pydicom==3.0.2",
]

[project.optional-dependencies]
pydcm = ["pydcm==0.4.5"]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "pytest>=8.3,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["shim"]
testpaths = ["shim/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
